<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通信盗聴攻撃体験アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <h1>通信盗聴攻撃体験アプリ</h1>
        <p class="description">
            シナリオを選択して、安全な通信と危険な通信の違いを体験してみましょう。
        </p>

        <div class="scenario-selector">
            <button class="scenario-btn" data-scenario="1">① Free Wi-Fi + HTTP</button>
            <button class="scenario-btn" data-scenario="2">② Free Wi-Fi + HTTPS</button>
            <button class="scenario-btn" data-scenario="3">③ Free Wi-Fi + VPN/HTTP</button>
            <button class="scenario-btn" data-scenario="4">④ Free Wi-Fi + VPN/HTTPS</button>
            <button class="scenario-btn" data-scenario="5">⑤ 偽Wi-Fi + HTTPS</button>
            <button class="scenario-btn" data-scenario="6">⑥ 偽Wi-Fi + VPN</button>
        </div>

        <div id="message-area" class="message-display">
            上のボタンからシナリオを選択してください。
        </div>

        <div class="main-content-area">
            <div class="user-side">
                <div class="browser-window">
                    <div class="url-bar">
                        <span id="cert-status" class="status"></span>
                        <span id="url-text" class="url"></span>
                    </div>
                    <div id="site-content-wrapper" class="site-content">
                        </div>
                </div>
            </div>

            <div class="attacker-panel">
                <h2>攻撃者コンソール</h2>
                <div id="packet-log" class="packet-log"></div>
            </div>
        </div>

    </div>

    <div id="cert-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <h3 id="modal-title"></h3>
            <pre id="modal-body"></pre>
            <p id="modal-explanation"></p>
        </div>
    </div>

    <footer>
        <p>©VISUSEC 2022-2026 <a href="https://visusec.jp/license/" target="_blank">利用規約</a></p>
        <p>通信盗聴攻撃体験アプリ （Ver.2 - 20260118）</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
